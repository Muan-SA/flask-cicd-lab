
name: Build and Publish Flask Image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Test, build and publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and commit
        shell: bash
        run: |
          set -euo pipefail

          # Validate semantic version format
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi

          # Verify main is available locally
          git rev-parse --verify refs/remotes/origin/main

          # Check that release tag points to the latest main commit
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          RELEASE_SHA="$(git rev-parse HEAD)"

          if [[ "$RELEASE_SHA" != "$MAIN_SHA" ]]; then
            echo "Release tag must reference the current main HEAD"
            echo "Release: $RELEASE_SHA"
            echo "Main:    $MAIN_SHA"
            exit 1
          fi

          echo "Release $GITHUB_REF_NAME validated successfully"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          REPO=$(echo "$GITHUB_REPOSITORY" |
            tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$REPO" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:lab
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
